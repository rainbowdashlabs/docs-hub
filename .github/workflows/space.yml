name: Docs space

on:
  workflow_call:
    inputs:
      docs-path:
        description: Folder of the calling repository that holds its docs.
        type: string
        default: docs
      hub-repository:
        description: Repository of the hub that lists the calling repository as a source, for example eldoriarpg/docs.
        type: string
        required: true
      hub-ref:
        description: Branch of the hub to build with.
        type: string
        default: main
      app-id:
        description: App ID or Client ID of the GitHub App that may start a rebuild of the hub. Pass it explicitly, the variables of another owner are not available here.
        type: string
        default: ''
      rebuild:
        description: Ask the hub to rebuild after a push to the default branch. Needs the App credentials.
        type: boolean
        default: true
    secrets:
      DOCS_APP_PRIVATE_KEY:
        description: Private key of the GitHub App that may start a rebuild of the hub.
        required: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Look for docs changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS: ${{ inputs.docs-path }}
          PULL: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PULL}/files" --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE "^(${DOCS%/}/|\.github/workflows/docs\.yml$)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No docs changes, nothing to build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the hub
        if: steps.changes.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.hub-repository }}
          ref: ${{ inputs.hub-ref }}
          path: hub
      - name: Check out the docs
        if: steps.changes.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          path: source
      - name: Set up Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: hub/.nvmrc
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - name: Install
        if: steps.changes.outputs.changed == 'true'
        working-directory: hub
        run: npm ci
      - name: Build the hub with these docs
        if: steps.changes.outputs.changed == 'true'
        working-directory: hub
        run: |
          name=$(printf %s "${GITHUB_REPOSITORY#*/}" | tr '[:lower:]' '[:upper:]' | tr -c 'A-Z0-9' '_')
          export "HUB_SOURCE_${name}=${GITHUB_WORKSPACE}/source/${{ inputs.docs-path }}"
          npm run build

  publish:
    if: inputs.rebuild && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Split the hub repository
        id: hub
        env:
          HUB: ${{ inputs.hub-repository }}
        run: |
          echo "owner=${HUB%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${HUB#*/}" >> "$GITHUB_OUTPUT"
      - name: Create a token for the hub
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-id || vars.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: ${{ steps.hub.outputs.owner }}
          repositories: ${{ steps.hub.outputs.name }}
      - name: Rebuild the hub
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: >-
          gh api repos/${{ inputs.hub-repository }}/dispatches
          -f event_type=docs-changed
          -f "client_payload[repository]=${{ github.repository }}"
